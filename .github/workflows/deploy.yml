name: Deploy

# Production deploys (ADR-032): after CI passes on main, or by hand. Signs in to Google Cloud
# with Workload Identity Federation (no keys). Repository variables come from
# `terraform output github_variables`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGISTRY }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SITE_URL: https://cornerpin.app
      # Until DNS points at Firebase Hosting, set the repository variable SMOKE_URL to the
      # hosting_url output (https://<project>.web.app).
      SMOKE_URL: ${{ vars.SMOKE_URL || 'https://cornerpin.app' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ env.SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the decisioning image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/decisioning/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/decisioning:${{ env.SHA }}
          cache-from: type=gha,scope=decisioning
          cache-to: type=gha,scope=decisioning,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: SITE_URL=${{ env.SITE_URL }}
          tags: ${{ env.REGISTRY }}/web:${{ env.SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Migrations run before the new API starts, so the code never meets an older schema.
      - name: Migrate
        run: |
          for job in migrate ops; do
            gcloud run jobs update "$job" --region "$REGION" --image "$REGISTRY/api:$SHA" --quiet
          done
          gcloud run jobs execute migrate --region "$REGION" --wait

      # Before the API, whose new code sends it scores to make (ADR-048).
      - name: Deploy the decisioning service
        run: gcloud run deploy decisioning --region "$REGION" --image "$REGISTRY/decisioning:$SHA" --quiet

      - name: Deploy the API
        run: gcloud run deploy api --region "$REGION" --image "$REGISTRY/api:$SHA" --quiet

      # Events a migration queued have had no drain to book their wake-up (ADR-043); one drain
      # now handles those due and books the rest.
      - name: Drain the outbox once
        run: gcloud scheduler jobs run drain-outbox --location "$REGION" --quiet

      - name: Deploy the web app
        run: gcloud run deploy web --region "$REGION" --image "$REGISTRY/web:$SHA" --quiet

      - name: Smoke check
        run: |
          # /v1/health goes through the web app to the private API: the whole chain works.
          for path in /v1/health /juniper-bench /juniper-bench/lots/2-5 /serwist/sw.js; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
              --output /dev/null "$SMOKE_URL$path"
            echo "ok $path"
          done
