# uv workspace root, so `uv run pytest`, `uv run ruff check`, `uv run pyright` and
# `uv run alembic upgrade head` work from the repo root (CLAUDE.md commands).
[project]
name = "cornerpin-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["cornerpin-api"]

[dependency-groups]
dev = [
    # The decisioning service, so tests can score in-process (ADR-048); never in the API image.
    "cornerpin-decisioning",
    "httpx2>=2.13.1",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/decisioning"]

[tool.uv.sources]
cornerpin-api = { workspace = true }
cornerpin-decisioning = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps/api/src", "apps/api/tests", "apps/decisioning/src", "apps/decisioning/tests", "evals"]
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/**" = ["S101"]
"apps/decisioning/tests/**" = ["S101"]

[tool.pyright]
include = [
    "apps/api/src",
    "apps/api/tests",
    "apps/api/migrations",
    "apps/decisioning/src",
    "apps/decisioning/tests",
    "evals",
]
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = ["apps/api/src", "apps/decisioning/src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/decisioning/tests"]
addopts = "-ra"
