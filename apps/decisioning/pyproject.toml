[project]
name = "cornerpin-decisioning"
version = "0.1.0"
description = "Cornerpin decisioning service: the lead model behind POST /v1/score (ADR-048)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116",
    "lightgbm>=4.6",
    "numpy>=2.2",
    "pydantic>=2.11",
    "uvicorn[standard]>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cornerpin_decisioning"]
