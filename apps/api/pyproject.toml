[project]
name = "cornerpin-api"
version = "0.1.0"
description = "Cornerpin API: REST /v1, GraphQL /graphql, webhooks and /internal task handlers"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "anthropic>=1.11.0",
    "cryptography>=45",
    "email-validator>=2.2",
    "fastapi>=0.116",
    "geoalchemy2>=0.17",
    "google-cloud-storage>=3",
    "httpx>=0.28",
    "lightgbm>=4.6",
    "numpy>=2.2",
    "pillow>=11",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.20",
    "pywebpush>=2.0",
    "sqlalchemy>=2.0.41",
    "strawberry-graphql[fastapi]>=0.270",
    "uvicorn[standard]>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cornerpin"]
